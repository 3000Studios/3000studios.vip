<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>3000 Studios — Song Drop</title>
    <style>
      :root {
        color-scheme: dark;
        --gold: #f2c14e;
        --ink: #080a10;
        --card: #121722;
        --muted: #aeb8ca;
        --ok: #4ade80;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: radial-gradient(circle at 80% 0, #30230e 0, transparent 30%), var(--ink);
        color: #fff;
        font:
          16px system-ui,
          sans-serif;
      }
      .shell {
        max-width: 960px;
        margin: auto;
        padding: 24px;
      }
      .brand {
        letter-spacing: 0.14em;
        color: var(--gold);
        font-weight: 900;
      }
      h1 {
        font-size: clamp(2rem, 7vw, 4.8rem);
        line-height: 0.95;
        margin: 0.5rem 0;
      }
      p {
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 18px;
      }
      .card {
        background: #121722e8;
        border: 1px solid #283144;
        border-radius: 22px;
        padding: 22px;
        box-shadow: 0 18px 50px #0008;
      }
      .drop {
        border: 2px dashed #56627a;
        border-radius: 18px;
        padding: 38px 18px;
        text-align: center;
        cursor: pointer;
      }
      .drop:focus-visible,
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 3px;
      }
      input,
      select,
      button {
        width: 100%;
        min-height: 48px;
        border-radius: 12px;
        border: 1px solid #39445a;
        background: #0c1018;
        color: #fff;
        padding: 12px;
        margin-top: 10px;
      }
      button {
        background: var(--gold);
        color: #111;
        font-weight: 850;
        border: 0;
        cursor: pointer;
      }
      .danger {
        background: #ef4444;
        color: #fff;
      }
      .row {
        display: flex;
        gap: 10px;
      }
      .row > * {
        flex: 1;
      }
      .job {
        padding: 12px 0;
        border-bottom: 1px solid #283144;
      }
      .bar {
        height: 8px;
        background: #242c3b;
        border-radius: 9px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--gold), #ff7a18);
      }
      small {
        color: var(--muted);
      }
      @media (max-width: 720px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .shell {
          padding: 15px;
        }
        .card {
          padding: 17px;
        }
        .row {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="brand">3000 STUDIOS · OWNER CONTROL</div>
      <h1>Remote Song Drop</h1>
      <p>
        Upload once. Build the release package, music video, and every social format from anywhere.
      </p>
      <div class="grid">
        <section class="card">
          <label
            >Private device key<input
              id="token"
              type="password"
              autocomplete="off"
              placeholder="Pairing key" /></label
          ><label class="drop" id="drop" tabindex="0"
            >Choose or drop a WAV, MP3, M4A, or FLAC<input
              id="file"
              type="file"
              accept="audio/*,.wav,.flac"
              hidden
          /></label>
          <div id="chosen"><small>No song selected</small></div>
          <label
            >Pipeline mode<select id="mode">
              <option value="dry_run">Dry run — generate previews only</option>
              <option value="build_only">Build — create every package</option>
              <option value="publish">Publish — use connected APIs</option>
            </select></label
          >
          <div id="confirm" hidden>
            <label>Type PUBLISH 3000 STUDIOS<input id="phrase" /></label>
          </div>
          <button id="send">Start remote flow</button>
          <p id="message" role="status"></p>
        </section>
        <section class="card">
          <h2>Job checklist</h2>
          <div id="jobs"><small>Enter the device key to load jobs.</small></div>
          <button id="refresh">Refresh status</button>
        </section>
      </div>
    </main>
    <script>
      const API = 'https://apex-citadel-api.mr-jwswain.workers.dev';
      const $ = (id) => document.getElementById(id);
      let selected;
      const token = $('token');
      token.value = localStorage.getItem('musicDeviceToken') || '';
      $('drop').onclick = () => $('file').click();
      $('drop').onkeydown = (e) => {
        if (e.key === 'Enter' || e.key === ' ') $('file').click();
      };
      $('file').onchange = (e) => {
        selected = e.target.files[0];
        $('chosen').textContent = selected
          ? `${selected.name} · ${(selected.size / 1048576).toFixed(1)} MB`
          : 'No song selected';
      };
      $('mode').onchange = () => {
        $('confirm').hidden = $('mode').value !== 'publish';
      };
      async function load() {
        if (!token.value) return;
        localStorage.setItem('musicDeviceToken', token.value);
        const r = await fetch(`${API}/music/jobs`, {
          headers: { 'x-music-device-token': token.value },
        });
        if (!r.ok) {
          $('jobs').textContent = 'Unable to authenticate or load jobs.';
          return;
        }
        const d = await r.json();
        $('jobs').innerHTML =
          (d.jobs || [])
            .reverse()
            .map(
              (j) =>
                `<div class="job"><b>${esc(j.originalName)}</b><br><small>${esc(j.stage)} · ${esc(j.state)}</small><div class="bar"><i style="width:${Number(j.progress) || 0}%"></i></div></div>`,
            )
            .join('') || '<small>No jobs yet.</small>';
      }
      $('send').onclick = async () => {
        if (!selected || !token.value) {
          $('message').textContent = 'Choose a song and enter the private device key.';
          return;
        }
        const mode = $('mode').value;
        if (mode === 'publish' && $('phrase').value !== 'PUBLISH 3000 STUDIOS') {
          $('message').textContent = 'Exact publish confirmation is required.';
          return;
        }
        $('send').disabled = true;
        $('message').textContent = 'Uploading securely…';
        try {
          const r = await fetch(`${API}/music/jobs`, {
            method: 'POST',
            headers: {
              'content-type': selected.type || 'audio/wav',
              'content-length': String(selected.size),
              'x-file-name': selected.name,
              'x-pipeline-mode': mode,
              'x-publish-confirmation': $('phrase').value,
              'x-music-device-token': token.value,
            },
            body: selected,
          });
          const d = await r.json();
          if (!r.ok) throw Error(d.error || 'Upload failed');
          $('message').textContent = `Queued ${d.id}`;
          await load();
        } catch (e) {
          $('message').textContent = e.message;
        } finally {
          $('send').disabled = false;
        }
      };
      $('refresh').onclick = load;
      token.onchange = load;
      function esc(v) {
        return String(v ?? '').replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      }
    </script>
  </body>
</html>
