# Cloudflare Pages — web app
# When deploying from apps/web: functions/ is auto-discovered next to this file.
# Git integration: set Pages Root directory to `apps/web`, Build output `dist`,
# Build command from monorepo root (see docs). Do not exclude /api from _routes.json.
name = "3000studios-vip"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "apex_citadel"
database_id = "6ae6bd18-e43a-4c57-beba-0c3ed1b5a56b"
