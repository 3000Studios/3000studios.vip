<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TikTok callback — 3000 Studios</title>
  <style>
    body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:#07070a; color:#f4f4f5; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 20px; }
    a { color:#fe2c55; }
  </style>
</head>
<body>
  <main>
    <h1>TikTok Login Kit callback</h1>
    <p>Authorization returned to <code>https://3000studios.vip/tiktok/callback</code>.</p>
    <p id="status">Completing login…</p>
    <p><a id="continue" href="/tiktok">Continue to promo upload</a></p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const code = params.get("code");
    const status = document.getElementById("status");
    if (!code) {
      status.textContent = "TikTok did not return an authorization code.";
    } else {
      fetch("https://apex-citadel-api.mr-jwswain.workers.dev/tiktok/oauth/exchange", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ code, redirectUri: "https://3000studios.vip/tiktok/callback" }),
      }).then(async (response) => {
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Authorization failed");
        status.textContent = "TikTok connected securely. Returning to promo upload…";
        location.href = "/tiktok/?session=" + encodeURIComponent(result.session);
      }).catch((error) => { status.textContent = error.message; });
    }
  </script>
</body>
</html>
